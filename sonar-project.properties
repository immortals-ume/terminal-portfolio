# SonarQube Configuration for Terminal Portfolio
# Project identification
sonar.projectKey=terminal-portfolio
sonar.projectName=Terminal Portfolio
sonar.projectVersion=1.0.0
sonar.projectDescription=Interactive Matrix-themed terminal portfolio built with Next.js and React
# Source code configuration
sonar.sources=src
sonar.tests=__tests__,e2e
sonar.sourceEncoding=UTF-8
# Language configuration
sonar.typescript.node=node
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Test configuration
sonar.testExecutionReportPaths=test-results/results.xml
sonar.coverageReportPaths=coverage/coverage-final.json
# Exclusions
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/.next/**,**/coverage/**,**/dist/**,**/build/**,**/*.config.js,**/*.config.ts,**/public/**,**/*.d.ts
sonar.test.exclusions=src/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.config.js,**/*.config.ts,**/*.d.ts,**/public/**,**/__tests__/**,**/e2e/**
# Duplication configuration
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
# Quality gate configuration
sonar.qualitygate.wait=true
# Analysis parameters
sonar.analysis.mode=publish
# SCM configuration
sonar.scm.provider=git
sonar.scm.forceReloadAll=true
# Additional settings
sonar.log.level=INFO
sonar.verbose=false
# Code quality rules
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
# Ignore console.log in development files
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2228
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.config.*
# Ignore
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
# Ignore magic numbers in tests
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S109
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.test.*,**/*.spec.*
# Ignore cognitive complexity in test files
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.test.*,**/*.spec.*
# Ignore duplicate string literals in tests
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S1192
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.test.*,**/*.spec.*