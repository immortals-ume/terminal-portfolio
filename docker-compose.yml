version: '3.8'

services:
  terminal-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time arguments (non-sensitive)
        - NEXT_PUBLIC_GITHUB_USERNAME=${NEXT_PUBLIC_GITHUB_USERNAME:-immortals-ume}
        - NEXT_PUBLIC_FULL_NAME=${NEXT_PUBLIC_FULL_NAME:-Kapil Srivastava}
        - NEXT_PUBLIC_EMAIL=${NEXT_PUBLIC_EMAIL:-kapil.srivastava712@gmail.com}
        - NEXT_PUBLIC_WEBSITE=${NEXT_PUBLIC_WEBSITE:-https://kapilsrivastava.dev}
        - NEXT_PUBLIC_CREDLY_USER_ID=${NEXT_PUBLIC_CREDLY_USER_ID:-kapil-srivastava.591fdf08}
        - NEXT_PUBLIC_FEATURED_REPOS=${NEXT_PUBLIC_FEATURED_REPOS:-terminal-portfolio,project-alpha}
        - NEXT_PUBLIC_ENABLE_MATRIX_BACKGROUND=${NEXT_PUBLIC_ENABLE_MATRIX_BACKGROUND:-true}
        - NEXT_PUBLIC_DEBUG_MODE=${NEXT_PUBLIC_DEBUG_MODE:-false}
    ports:
      - "3000:3000"
    environment:
      # Runtime environment variables (can include sensitive data)
      - NODE_ENV=production
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - EMAIL_SERVICE_API_KEY=${EMAIL_SERVICE_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - terminal-portfolio
    restart: unless-stopped
    profiles:
      - production